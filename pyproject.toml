[project]
name = "carbontrack"
version = "0.1.0"
description = "MRV platform for carbon-removal projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "alembic>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends/Query pattern)
    "W191",  # indentation contains tabs
    "B904",  # raise ... from err
    "UP042", # replace str, Enum with StrEnum (SQLAlchemy 2.0 Enum mapping uses (str, enum.Enum))
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101", "B011", "UP017", "F401", "F841"]
"app/schemas/__init__.py" = ["F401"]
"alembic/*" = ["I001", "UP035", "F401"]
"scripts/*" = ["BLE001", "E402"]
