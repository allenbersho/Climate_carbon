services:
  - type: web
    name: carbontrack-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -e . && pip install alembic"
    preDeployCommand: "alembic upgrade head && python scripts/seed_admin.py && python scripts/seed_methodologies.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carbontrack-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FIRST_ADMIN_EMAIL
        value: admin@carbontrack.org
      - key: FIRST_ADMIN_PASSWORD
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "10485760"

databases:
  - name: carbontrack-db
    plan: free
    region: oregon
    databaseName: carbontrack
    user: carbontrack_user
